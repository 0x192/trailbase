name: 'Setup Build'
description: 'Sets up the build/test environment on Ubuntu'

runs:
  using: "composite"
  steps:
    - name: Inspect Checkout
      shell: bash
      run: git describe --tags

    - name: Install Dependencies
      shell: bash
      run: |
        sudo apt-get update && \
          sudo apt-get install -y --no-install-recommends curl libssl-dev pkg-config libclang-dev protobuf-compiler libprotobuf-dev libgeos-dev

    - uses: pnpm/setup@v2
      with:
        runtime: bun@latest
        version: "^12.0.0"

    - uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: 1.95.0
        components: rustfmt, clippy
        default: true

    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Install fake sendmail
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/fakebin"
        cat > "$RUNNER_TEMP/fakebin/sendmail" <<'EOF'
        #!/usr/bin/env bash
        cat >/dev/null
        exit 0
        EOF
        chmod +x "$RUNNER_TEMP/fakebin/sendmail"
        echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
